# The lab cluster: a real 3-node CockroachDB cluster in containers.
#
# Every lab in this course runs against this. It is identical on Windows, macOS
# and Linux, so there is nothing to install but Docker.
#
#   scripts/crdb up          start the cluster (3 nodes, initialised)
#   scripts/crdb sql         open a SQL shell
#   scripts/crdb stop 2      simulate a node failure
#   scripts/crdb down        remove the cluster and its data
#
# On Windows use scripts\crdb.bat; on macOS/Linux use scripts/crdb.sh.

name: crdb-labs

x-node: &node
  image: cockroachdb/cockroach:${CRDB_VERSION:-v23.2.5}
  restart: unless-stopped
  # A node must keep its identity across stop/start, or Lab 1's restart-and-
  # rejoin lesson would instead show a brand-new node joining.
  stop_grace_period: 60s

services:
  crdb1:
    <<: *node
    container_name: crdb1
    hostname: crdb1
    command: >
      start --insecure --advertise-addr=crdb1
      --join=crdb1,crdb2,crdb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
      --external-io-dir=/backups
    ports:
      - "26257:26257"   # SQL
      - "8080:8080"     # DB Console
    volumes:
      - crdb1-data:/cockroach/cockroach-data
      - crdb-backups:/backups

  crdb2:
    <<: *node
    container_name: crdb2
    hostname: crdb2
    command: >
      start --insecure --advertise-addr=crdb2
      --join=crdb1,crdb2,crdb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
    ports:
      - "26258:26257"
      - "8081:8080"
    volumes:
      - crdb2-data:/cockroach/cockroach-data

  crdb3:
    <<: *node
    container_name: crdb3
    hostname: crdb3
    command: >
      start --insecure --advertise-addr=crdb3
      --join=crdb1,crdb2,crdb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
    ports:
      - "26259:26257"
      - "8082:8080"
    volumes:
      - crdb3-data:/cockroach/cockroach-data

  # A fourth node, off by default. Lab 1 starts it to show that decommissioning
  # needs spare capacity:  scripts/crdb add-node
  crdb4:
    <<: *node
    container_name: crdb4
    hostname: crdb4
    profiles: ["scale"]
    command: >
      start --insecure --advertise-addr=crdb4
      --join=crdb1,crdb2,crdb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
    ports:
      - "26260:26257"
      - "8083:8080"
    volumes:
      - crdb4-data:/cockroach/cockroach-data

  # One-shot: runs `cockroach init` once the nodes are listening, then exits.
  init:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v23.2.5}
    container_name: crdb-init
    depends_on: [crdb1, crdb2, crdb3]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      'for i in $$(seq 1 60); do
         if /cockroach/cockroach init --insecure --host=crdb1 2>/dev/null; then
           echo "cluster initialised"; exit 0
         fi
         if /cockroach/cockroach sql --insecure --host=crdb1 -e "SELECT 1" >/dev/null 2>&1; then
           echo "cluster already initialised"; exit 0
         fi
         sleep 2
       done
       echo "init failed after 120s"; exit 1'

volumes:
  crdb-backups:
    name: crdb-shared-backups
  crdb1-data:
  crdb2-data:
  crdb3-data:
  crdb4-data:
