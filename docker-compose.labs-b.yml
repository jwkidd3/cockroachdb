# The STANDBY cluster for Lab 11 (cross-cluster DR drill).
# Same shape as docker-compose.labs.yml, different project name and ports:
#   SQL 26357-26359, DB Console 8180-8182.
# Drive it with:  CRDB_COMPOSE=docker-compose.labs-b.yml scripts/crdb.sh up
#
# Every lab in this course runs against this. It is identical on Windows, macOS
# and Linux, so there is nothing to install but Docker.
#
#   scripts/crdb up          start the cluster (3 nodes, initialised)
#   scripts/crdb sql         open a SQL shell
#   scripts/crdb stop 2      simulate a node failure
#   scripts/crdb down        remove the cluster and its data
#
# On Windows use scripts\crdb.bat; on macOS/Linux use scripts/crdb.sh.

name: crdb-labs-b

x-node: &node
  image: cockroachdb/cockroach:${CRDB_VERSION:-v23.2.5}
  restart: unless-stopped
  # A node must keep its identity across stop/start, or Lab 1's restart-and-
  # rejoin lesson would instead show a brand-new node joining.
  stop_grace_period: 60s

services:
  crdbb1:
    <<: *node
    container_name: crdbb1
    hostname: crdbb1
    command: >
      start --insecure --advertise-addr=crdbb1
      --join=crdbb1,crdbb2,crdbb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
      --external-io-dir=/backups
    ports:
      - "26357:26257"   # SQL
      - "8180:8080"     # DB Console
    volumes:
      - crdbb1-data:/cockroach/cockroach-data
      - crdb-backups:/backups

  crdbb2:
    <<: *node
    container_name: crdbb2
    hostname: crdbb2
    command: >
      start --insecure --advertise-addr=crdbb2
      --join=crdbb1,crdbb2,crdbb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
    ports:
      - "26358:26257"
      - "8181:8080"
    volumes:
      - crdbb2-data:/cockroach/cockroach-data

  crdbb3:
    <<: *node
    container_name: crdbb3
    hostname: crdbb3
    command: >
      start --insecure --advertise-addr=crdbb3
      --join=crdbb1,crdbb2,crdbb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
    ports:
      - "26359:26257"
      - "8182:8080"
    volumes:
      - crdbb3-data:/cockroach/cockroach-data

  # A fourth node, off by default. Lab 1 starts it to show that decommissioning
  # needs spare capacity:  scripts/crdb add-node
  crdbb4:
    <<: *node
    container_name: crdbb4
    hostname: crdbb4
    profiles: ["scale"]
    command: >
      start --insecure --advertise-addr=crdbb4
      --join=crdbb1,crdbb2,crdbb3
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
    ports:
      - "26360:26257"
      - "8183:8080"
    volumes:
      - crdbb4-data:/cockroach/cockroach-data

  # One-shot: runs `cockroach init` once the nodes are listening, then exits.
  init:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v23.2.5}
    container_name: crdbb-init
    depends_on: [crdbb1, crdbb2, crdbb3]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      'for i in $$(seq 1 60); do
         if /cockroach/cockroach init --insecure --host=crdbb1 2>/dev/null; then
           echo "cluster initialised"; exit 0
         fi
         if /cockroach/cockroach sql --insecure --host=crdbb1 -e "SELECT 1" >/dev/null 2>&1; then
           echo "cluster already initialised"; exit 0
         fi
         sleep 2
       done
       echo "init failed after 120s"; exit 1'

volumes:
  crdb-backups:
    name: crdb-shared-backups
  crdbb1-data:
  crdbb2-data:
  crdbb3-data:
  crdbb4-data:
