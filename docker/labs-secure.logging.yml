# Lab 12 Part E overlay: restart the secure node with an auditable log sink.
#
#   docker compose -f docker/labs-secure.yml \
#                  -f docker/labs-secure.logging.yml up -d crdbs1
#
# Write lab12/logs.yaml in the repo root; audit records appear in lab12/logs.

services:
  crdbs1:
    command: >
      start-single-node --certs-dir=/certs
      --advertise-addr=crdbs1
      --http-addr=0.0.0.0:8080
      --cache=.25 --max-sql-memory=.25
      --log-config-file=/lab12/logs.yaml
